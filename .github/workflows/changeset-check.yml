name: Changeset Check

on:
  pull_request:
    paths:
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".changeset/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify changesets present for package changes
        run: bun run changeset status --output=.changeset/status.json
