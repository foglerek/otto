name: Release Dry Run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".changeset/**"

jobs:
  dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate release mode
        id: release_mode
        run: node scripts/release/evaluate-mode.mjs

      - name: Report release mode
        run: |
          echo "mode=${{ steps.release_mode.outputs.mode }}"
          echo "changeset_count=${{ steps.release_mode.outputs.changeset_count }}"
          echo "head_subject=${{ steps.release_mode.outputs.head_subject }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate repository
        run: bun run lint && bun run typecheck && bun run test && bun run build

      - name: Snapshot version dry-run
        if: steps.release_mode.outputs.mode != 'none'
        run: bun run version-packages -- --snapshot dryrun

      - name: Show versioning diff
        if: steps.release_mode.outputs.mode != 'none'
        run: git --no-pager diff --stat
